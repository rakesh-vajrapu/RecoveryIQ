name: recoveriq

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recoveriq}
      POSTGRES_USER: ${POSTGRES_USER:-recoveriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recoveriq-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - recoveriq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - recoveriq-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  recoveriq-postgres-data:
  recoveriq-redis-data:

