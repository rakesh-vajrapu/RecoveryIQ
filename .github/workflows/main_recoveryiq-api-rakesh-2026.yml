name: Build and deploy Python app to Azure Web App - recoveryiq-api-rakesh-2026

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: recoveryiq-azure-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Log the Git commit SHA being deployed
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "Deploying commit: ${{ github.event.workflow_run.head_sha }}"
          else
            echo "Deploying from workflow_dispatch (manual run)"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare Deployment Package
        run: |
          mkdir -p .azure-deploy
          
          # Copy backend requirements to the root of the deployment package
          cp requirements/backend.txt .azure-deploy/requirements.txt
          
          # Copy source directories
          mkdir -p .azure-deploy/apps
          cp -r apps/api .azure-deploy/apps/
          cp -r artifacts .azure-deploy/
          
      - name: Verify Package Assertions
        run: |
          # Assert REQUIRED files/directories exist
          if [ ! -f ".azure-deploy/apps/api/app/main.py" ]; then echo "Missing apps/api/app/main.py"; exit 1; fi
          if [ ! -f ".azure-deploy/requirements.txt" ]; then echo "Missing requirements.txt"; exit 1; fi
          if [ ! -f ".azure-deploy/artifacts/policy/recoveriq-sequential-v2/successful-adaptive-trace-v2.json" ]; then echo "Missing successful-adaptive-trace-v2.json"; exit 1; fi
          if [ ! -f ".azure-deploy/artifacts/policy/recoveriq-sequential-v2/bounded-failure-trace-v2.json" ]; then echo "Missing bounded-failure-trace-v2.json"; exit 1; fi
          
          # Assert FORBIDDEN files/directories DO NOT exist
          if [ -d ".azure-deploy/apps/web" ]; then echo "Found forbidden apps/web"; exit 1; fi
          if [ -d ".azure-deploy/simulator" ]; then echo "Found forbidden simulator"; exit 1; fi
          if [ -d ".azure-deploy/ml" ]; then echo "Found forbidden ml"; exit 1; fi
          if [ -f ".azure-deploy/.env" ]; then echo "Found forbidden .env"; exit 1; fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CA3088355A7D468A8E48134CC9D60E8D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B228777CC2C04753A87ADE0173B4D8DB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D8C07F9C6DE44E4398A375023895D524 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'recoveryiq-api-rakesh-2026'
          slot-name: 'Production'
          package: '.azure-deploy'
          
      - name: Post-Deploy Health Verification
        run: |
          echo "Verifying /health endpoint..."
          ATTEMPTS=0
          MAX_ATTEMPTS=18
          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}\n" https://recoveryiq-api-rakesh-2026.azurewebsites.net/health)
            if [ "$STATUS_CODE" == "200" ]; then
              echo "Health check passed!"
              curl -s https://recoveryiq-api-rakesh-2026.azurewebsites.net/health
              break
            fi
            echo "Attempt $((ATTEMPTS+1)) failed with status $STATUS_CODE. Retrying in 10s..."
            ATTEMPTS=$((ATTEMPTS+1))
            sleep 10
          done
          
          if [ $ATTEMPTS -eq $MAX_ATTEMPTS ]; then
            echo "Health verification failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

      - name: Verify Replay API
        run: |
          echo "Verifying /api/evaluation/replay/presets endpoint..."
          RESPONSE=$(curl -s https://recoveryiq-api-rakesh-2026.azurewebsites.net/api/evaluation/replay/presets)
          
          if [[ "$RESPONSE" != *"successful-adaptive-trace-v2"* ]]; then
            echo "Response missing successful-adaptive-trace-v2: $RESPONSE"
            exit 1
          fi
          
          if [[ "$RESPONSE" != *"bounded-failure-trace-v2"* ]]; then
            echo "Response missing bounded-failure-trace-v2: $RESPONSE"
            exit 1
          fi
          
          echo "Replay API verification passed!"