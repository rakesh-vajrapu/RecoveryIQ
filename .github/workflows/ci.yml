name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  simulator:
    name: Simulator quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: >-
          uv run mypy
          recoveriq_simulator
          recoveriq_detector
          recoveriq_detector_v2
          recoveriq_ml
          recoveriq_ml_v2
          recoveriq_policy
          recoveriq_policy_evaluation
          recoveriq_sequential
          recoveriq_sequential_policy
          tests
      - run: uv run pytest

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev --locked
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run mypy app tests
      - name: Critical Financial Path Gate
        run: |
          CFP_TESTS=$(python -c "import json; print(' '.join(t for cfp in json.load(open('tests/critical_financial_paths.json')).values() for t in cfp.get('tests', [])))")
          uv run pytest $CFP_TESTS
      - run: uv run pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
