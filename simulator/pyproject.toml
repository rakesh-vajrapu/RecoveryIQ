[project]
name = "recoveriq-simulator"
version = "0.2.0"
description = "Deterministic recurring-payment recovery environment and baselines"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.3,<3",
  "pandas>=2.3,<4",
  "pyarrow>=21,<24",
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<3",
  "pandas-stubs>=2.3,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recoveriq_simulator"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
