[project]
name = "recoveriq-simulator"
version = "0.3.0"
description = "Deterministic recurring-payment recovery environment and baselines"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib>=1.5,<2",
  "lightgbm>=4.6,<5",
  "numpy>=2.3,<3",
  "pandas>=2.3,<4",
  "pyarrow>=21,<24",
  "pydantic>=2.11,<3",
  "scikit-learn>=1.9,<2",
  "shap>=0.50,<1",
]

[project.scripts]
degradation = "recoveriq_detector.cli:main"
degradation-v2 = "recoveriq_detector_v2.cli:main"
recovery-model = "recoveriq_ml.cli:main"
recovery-policy = "recoveriq_policy.cli:main"
recovery-sequential = "recoveriq_ml_v2.cli:main"
recovery-sequential-policy = "recoveriq_sequential_policy.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<3",
  "pandas-stubs>=2.3,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "recoveriq_simulator",
  "recoveriq_detector",
  "recoveriq_detector_v2",
  "recoveriq_ml",
  "recoveriq_policy",
  "recoveriq_policy_evaluation",
  "recoveriq_sequential",
  "recoveriq_ml_v2",
  "recoveriq_sequential_policy",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "joblib",
  "lightgbm",
  "pandas",
  "pandas.*",
  "shap",
  "sklearn",
  "sklearn.*",
]
ignore_missing_imports = true
